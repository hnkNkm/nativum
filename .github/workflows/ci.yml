name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build dist
        run: ./tools/build.sh

      - name: Check dist freshness (committed dist matches src)
        run: git diff --exit-code -- dist/

      - name: Verify Security Contract
        run: ./tools/verify.sh

      - name: Check Agent Skill sync
        run: ./tools/check-skill-examples.sh
