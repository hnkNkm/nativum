name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist
        run: ./tools/build.sh

      - name: Check dist freshness (committed dist matches src)
        run: git diff --exit-code -- dist/

      - name: Verify Security Contract
        run: ./tools/verify.sh

      - name: Check Agent Skill sync
        run: ./tools/check-skill-sync.sh
