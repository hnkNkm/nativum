<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nativum — サインイン (reference implementation)</title>
  <!--
    アプリケーションに vendor した nativum.css を参照すること。
    (推奨構成: public/vendor/nativum/nativum.css)
    <link rel="stylesheet" href="/vendor/nativum/nativum.css">
    この例は参照パス nativum.css で同ディレクトリに配置した前提で書いている。
    すべてのクラス・トークンはこの Skill の references/ に記載されたもののみを使用する。
  -->
  <link rel="stylesheet" href="nativum.css">
</head>
<body>
  <main class="nv-container-narrow" style="padding-block: 3rem 4rem">
    <section class="nv-card nv-stack">
      <header class="nv-stack-sm">
        <h1 style="margin-block-end: 0">サインイン</h1>
        <p class="nv-text-muted">アカウントにログインしてください。</p>
      </header>

      <!-- サーバーが認証失敗時に再レンダリングするフォーム全体のエラー -->
      <div class="nv-notice nv-notice-danger" role="status">
        メールアドレスまたはパスワードが正しくありません。
      </div>

      <form action="/login" method="post">
        <div class="nv-field">
          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" autocomplete="email" required
                 aria-invalid="true" aria-describedby="email-error">
          <span class="nv-field-error" id="email-error">
            このメールアドレスは登録されていません。
          </span>
        </div>

        <div class="nv-field">
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" minlength="8" required>
        </div>

        <div class="nv-field nv-cluster nv-cluster-between">
          <label><input type="checkbox" name="remember"> ログイン状態を保持する</label>
          <a href="/forgot-password">パスワードをお忘れですか?</a>
        </div>

        <button class="nv-primary" type="submit" style="width: 100%">サインイン</button>
      </form>

      <p class="nv-text-muted" style="font-size: var(--nv-font-size-sm)">
        未入力・形式エラーは送信前にブラウザのネイティブ検証がブロックします。
      </p>
    </section>

    <footer class="nv-stack-sm" style="margin-block-start: 3rem">
      <hr>
      <p class="nv-text-muted">Nativum — passive, zero-JavaScript UI system.</p>
    </footer>
  </main>
</body>
</html>
